# Blueprint: everything that defines this application, in one file.
# Checked by scripts/check_blueprint.sh every time a run is submitted, so it
# cannot drift from the files it points to.
# Format: "key: value" lines, two spaces per level, no lists.

schema_version: 1
name: moana
description: Moana Ocean Hindcast rebuild, 5 km New Zealand, 1993-2020 (Souza et al., 2023)
state: draft                      # draft (not yet compared with anything) | validated

code:
  roms:
    location: https://github.com/myroms/roms.git
    commit: 57aecf589a408b1e5490d2db7f9bd0196062a44e    # must equal the roms/ submodule pin

compile_time:
  header: moana.h                 # CPP options (docs/BUILD_TODO.md task 2.1, not written yet)
  chained_cpp_flags: -DPERFECT_RESTART    # added when the run has more than one segment

run_time:
  input: roms_moana.in            # run parameters (task 2.2, not written yet)
  job: run_moana.slurm            # build, run, check (task 2.2, not written yet)

inputs:
  manifest: inputs.tsv            # sha256, path, source, version, script for every input file

run:
  segments: 1
